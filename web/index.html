<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio-Twin Operational Execution Console | Pharma 4.0</title>
    <link
      rel="stylesheet"
      href="https://jsdelivr.net"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://jsdelivr.net"></script>
    <script>
      stlite.mount(
        {
          requirements: new Array("pandas", "numpy", "plotly"),
          entrypoint: "streamlit_app.py",
          files: {
            "streamlit_app.py": `
import time
import datetime
import numpy as np
import pandas as pd
import plotly.graph_objects as go
import streamlit as st

st.set_page_config(
    page_title="Bio-Twin Operational Execution Console",
    page_icon="🧬",
    layout="wide",
    initial_sidebar_state="expanded"
)

COLS = list((
    "timestamp", "operational_status", "temperature_c", "ph",
    "agitation_rpm", "aeration_lmin", "substrate_feed_kghr",
    "t2_score", "spe_score"
))

if "anomaly" not in st.session_state:
    st.session_state.anomaly = False
if "history" not in st.session_state:
    st.session_state.history = pd.DataFrame(columns=COLS)

with st.sidebar:
    st.markdown("### 🎛️ Simulation Engine Control")
    running = st.toggle("Run Active Bioprocess Stream", value=True)

    st.markdown("---")
    st.markdown("### ⚙️ Process Control Interface")
    if st.button("⚠️ Inject Mechanical Agitation Anomaly", use_container_width=True):
        st.session_state.anomaly = True
    if st.button("✅ Reset to Normal Golden Envelope", use_container_width=True):
        st.session_state.anomaly = False

    st.markdown("---")
    st.markdown("### 🤖 AI Agent Settings")
    enable_ai = st.checkbox("Enable Groq LLM Analysis", value=True)
    st.caption("[← Back to srinivasta.github.io](https://github.io) | [GitHub Repo](https://github.com)")

st.title("🧬 Bio-Twin Operational Execution Console")
st.caption("Manufacturing Intelligence & Technology Transformation Framework Layer")

now_str = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
is_fault = st.session_state.anomaly

temp = round(25.0 + float(np.random.normal(0, 0.04)), 2)
ph = round(6.48 + float(np.random.normal(0, 0.02)), 2)
rpm = round(158.0 + float(np.random.normal(0, 2.5)), 2) if is_fault else round(120.5 + float(np.random.normal(0, 1.2)), 2)
air = round(250.0 + float(np.random.normal(0, 0.8)), 2)
feed = round(0.50 + float(np.random.normal(0, 0.008)), 2)
t2 = round(8.45 + float(np.random.normal(0, 0.25)), 2) if is_fault else round(2.25 + float(np.random.normal(0, 0.12)), 2)
spe = round(6.12 + float(np.random.normal(0, 0.22)), 2) if is_fault else round(1.50 + float(np.random.normal(0, 0.08)), 2)
status = "CRITICAL_DUAL_BREACH" if is_fault else "GOLDEN_ENVELOPE_VALIDATED"

row_dict = dict(
    timestamp=now_str,
    operational_status=status,
    temperature_c=temp,
    ph=ph,
    agitation_rpm=rpm,
    aeration_lmin=air,
    substrate_feed_kghr=feed,
    t2_score=t2,
    spe_score=spe
)

new_row = pd.DataFrame(list((row_dict,)))
st.session_state.history = pd.concat(list((st.session_state.history, new_row)), ignore_index=True).tail(25)
df = st.session_state.history

if is_fault:
    st.error("🔴 CRITICAL GxP STATUS ALARM: PROCESS SHIFT & RESIDUAL EXCURSION BREACH DETECTED")
else:
    st.success("🟢 GOLDEN ENVELOPE VALIDATED: ALL CPPs WITHIN STATISTICAL CONTROL LIMITS")

c1, c2, c3, c4, c5 = st.columns(5)
c1.metric("TEMPERATURE", f"{temp} °C")
c2.metric("PH", f"{ph}")
c3.metric("AGITATION RPM", f"{rpm} RPM")
c4.metric("AERATION RATE", f"{air} L/min")
c5.metric("SUBSTRATE FEED RATE", f"{feed} kg/hr")

col_left, col_right = st.columns(2)
y_limits = list((0, 10))

with col_left:
    fig_t2 = go.Figure()
    fig_t2.add_trace(go.Scatter(x=df.get("timestamp"), y=df.get("t2_score"), mode="lines+markers", name="T2_VALUE", line=dict(color="#58a6ff")))
    fig_t2.add_hline(y=6.0, line_dash="dash", line_color="#f85149", annotation_text="Upper Control Limit")
    fig_t2.update_layout(title="Hotelling T² Latent Variability Metrics", template="plotly_dark", height=300, margin=dict(l=20, r=20, t=40, b=20), yaxis=dict(range=y_limits))
    st.plotly_chart(fig_t2, use_container_width=True)

with col_right:
    fig_spe = go.Figure()
    fig_spe.add_trace(go.Scatter(x=df.get("timestamp"), y=df.get("spe_score"), mode="lines+markers", name="SPE_VALUE", line=dict(color="#3fb950")))
    fig_spe.add_hline(y=4.5, line_dash="dash", line_color="#f85149", annotation_text="Upper Control Limit")
    fig_spe.update_layout(title="Squared Prediction Error (SPE) Multi-Residual Trends", template="plotly_dark", height=300, margin=dict(l=20, r=20, t=40, b=20), yaxis=dict(range=y_limits))
    st.plotly_chart(fig_spe, use_container_width=True)

st.markdown("### 🤖 Groq Autonomous LLM Diagnostic Hub")
if enable_ai and is_fault:
    st.info("""
**[BATCH ANOMALY REPORT]**
- **Diagnostic Classification:** Unmodeled Disturbance
- **Primary Breach Profile:** Simultaneous exceedance of Hotelling T² and SPE limits indicates an unmodeled mechanical disturbance or raw material exception profile.
- **Probable Root-Cause Analysis:** Agitation drive failure or mechanical coupling slip causing RPM to exceed the 130.0 upper limit, introducing unmodeled shear stress not captured by the baseline PCA model.
- **Immediate SOP Corrective Actions:** 1) Manually verify agitator shaft coupling integrity and motor current draw. 2) Inspect agitation_rpm control loop PID parameters against the 110.0–130.0 CPP range.
    """)
else:
    st.info("Monitoring streaming IIoT feature vector matrix. Hotelling T² and SPE scores remain inside the Golden Envelope.")

st.markdown("### 📊 Historical Batch Audit File Viewer (data/processed/)")
st.dataframe(df.sort_index(ascending=False), use_container_width=True)

if running:
    time.sleep(1.5)
    st.rerun()
`
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
