name: GxP Continuous Integration Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-pipeline-checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

     Zarbee- Standard Python Environment Isolation
    - name: Initialize Python 3.11 Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Run Build Dependencies Installation
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint Architecture Mappings (Black Enforcer)
      run: black --check src/ tests/ app.py config/

    - name: Mathematical Verification Steps (Pytest Execution Layer)
      run: pytest tests/unit/test_pca_math.py -v
