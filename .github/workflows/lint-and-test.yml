name: GxP Continuous Integration Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-pipeline-checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Run Build Dependencies Installation
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint Style Report (Non-Blocking Check)
      run: |
        # Reports style anomalies without hard-failing the main structural environment
        black --check src/ tests/ app.py config/ || true
        flake8 src/ tests/ app.py config/ --count --exit-zero --max-line-length=127 --statistics

    - name: Mathematical Verification Steps (Pytest Execution Layer)
      run: |
        # Ensures paths are discovered by python interpreter paths explicitly
        export PYTHONPATH="${PYTHONPATH}:${PWD}"
        pytest tests/unit/test_pca_math.py -v
