name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Open Streamlit App
        env:
          STREAMLIT_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch({ headless: true });
              const page = await browser.newPage();
              await page.goto(process.env.STREAMLIT_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
              await page.waitForTimeout(4000);

              const wakeBtn = page.getByRole("button", { name: /get this app back up/i });
              if (await wakeBtn.isVisible()) {
                console.log("App was sleeping. Clicking wake-up button...");
                await wakeBtn.click();
                await page.waitForTimeout(15000);
              } else {
                console.log("App is already awake and active.");
              }

              await browser.close();
            })();
          '
